plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'target/**/*'
    - 'sig/**/*'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'

# The segmentation algorithm mirrors segment.rs in the Rust crate line by
# line; splitting it differently would break that mapping.
Metrics/AbcSize:
  Max: 20
  Exclude:
    - 'test/**/*'
    - 'lib/psychowl/ruby_engine/segmentation.rb'

Metrics/BlockLength:
  Max: 30
  Exclude:
    - 'test/**/*'
    - '**/*.gemspec'

Metrics/ClassLength:
  Max: 200
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - 'lib/psychowl/ruby_engine/segmentation.rb'

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'test/**/*'
    - 'lib/psychowl/ruby_engine/segmentation.rb'

Metrics/ModuleLength:
  Max: 150
  Exclude:
    - 'test/**/*'

Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - 'lib/psychowl/ruby_engine/segmentation.rb'

Naming/VariableNumber:
  AllowedPatterns:
    - 'iso639_\d' # ISO 639-1 / ISO 639-3 are the standards' names

Style/Documentation:
  Exclude:
    - 'test/**/*'

Style/FormatStringToken:
  Enabled: false # format("%.2f") in the CLI and benchmark

Minitest/MultipleAssertions:
  Enabled: false

Minitest/AssertionInLifecycleHook:
  Enabled: false
