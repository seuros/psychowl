[workspace]
members = ["ext/psychowl_native/core", "ext/psychowl_native/ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
repository = "https://github.com/seuros/psychowl"

[workspace.dependencies]
psychowl = { path = "ext/psychowl_native/core", version = "0.1.0" }
magnus = { version = "0.9.2", default-features = false }
rayon = "1.12.0"
rustc-hash = "2.1.3"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
needless_borrow = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
