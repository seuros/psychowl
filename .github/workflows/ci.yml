name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1 # the FFI crate needs Ruby headers to build
        with:
          ruby-version: "4.0"
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: bundle install && bundle exec rubocop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p psychowl
      - run: cargo package -p psychowl --allow-dirty

  ruby:
    name: ${{ matrix.ruby }} (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.3", engine: native, os: ubuntu-latest }
          - { ruby: "3.4", engine: native, os: ubuntu-latest }
          - { ruby: "4.0", engine: native, os: ubuntu-latest }
          - { ruby: "4.0", engine: native, os: macos-latest }
          - { ruby: "4.0", engine: ruby, os: ubuntu-latest }
          - { ruby: jruby, engine: ruby, os: ubuntu-latest }
          - { ruby: truffleruby, engine: ruby, os: ubuntu-latest }
    env:
      DISABLE_PSYCHOWL_NATIVE: ${{ matrix.engine == 'ruby' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - if: matrix.engine == 'native'
        uses: dtolnay/rust-toolchain@1.99
      - if: matrix.engine == 'native'
        uses: Swatinem/rust-cache@v2
      - if: matrix.engine == 'native'
        run: bundle exec rake compile
      - if: matrix.engine == 'native'
        name: Native extension is loaded
        run: bundle exec ruby -Ilib -rpsychowl -e 'abort "native extension not loaded" unless Psychowl.backend == :native'
      - run: bundle exec rake test

  freebsd:
    name: FreeBSD ${{ matrix.release }} (native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: false
          # llvm: libclang for rb-sys bindgen. Rust via rustup to match the
          # crate's rust-version instead of the quarterly package.
          prepare: |
            pkg install -y ruby devel/ruby-gems git curl llvm
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99
          run: |
            . "$HOME/.cargo/env"
            LIBCLANG_PATH="$(ls -d /usr/local/llvm*/lib | sort -V | tail -1)"
            export LIBCLANG_PATH
            gem install bundler --no-document
            bundle install
            bundle exec rake compile
            bundle exec ruby -Ilib -rpsychowl -e 'abort "native extension not loaded" unless Psychowl.backend == :native'
            bundle exec rake test
