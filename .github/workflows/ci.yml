name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (dictator, rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1 # clippy builds the FFI crate, which needs Ruby headers
        with:
          ruby-version: "4.0"
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: seuros/dictator-setup@v1
      - run: dictator lint .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p psychowl
      - run: cargo package -p psychowl --allow-dirty

  ruby:
    name: ${{ matrix.ruby }} (${{ matrix.engine }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "4.0", engine: native, os: ubuntu-latest }
          - { ruby: "4.0", engine: native, os: macos-latest }
          - { ruby: "4.0", engine: ruby, os: ubuntu-latest }
          - { ruby: jruby, engine: ruby, os: ubuntu-latest }
          - { ruby: truffleruby, engine: ruby, os: ubuntu-latest }
    env:
      DISABLE_PSYCHOWL_NATIVE: ${{ matrix.engine == 'ruby' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - if: matrix.engine == 'native'
        uses: dtolnay/rust-toolchain@1.99
      - if: matrix.engine == 'native'
        uses: Swatinem/rust-cache@v2
      - if: matrix.engine == 'native'
        run: bundle exec rake compile
      - if: matrix.engine == 'native'
        name: Native extension is loaded
        run: bundle exec ruby -Ilib -rpsychowl -e 'abort "native extension not loaded" unless Psychowl.backend == :native'
      - run: bundle exec rake test

  freebsd:
    name: FreeBSD 15.1 (native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          copyback: false
          # ruby40 ships RubyGems but not the gem command (FreeBSD packages it
          # only for its default Ruby). llvm: libclang for bindgen. rustup: the
          # crate's rust-version.
          prepare: |
            pkg install -y ruby40 git curl llvm gmake
            printf '%s\n' '#!/bin/sh' 'exec ruby40 -e "require %q(rubygems/gem_runner); Gem::GemRunner.new.run(ARGV)" -- "$@"' > /usr/local/bin/gem
            chmod +x /usr/local/bin/gem
            ln -sf ruby40 /usr/local/bin/ruby
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99
          run: |
            . "$HOME/.cargo/env"
            LIBCLANG_PATH="$(ls -d /usr/local/llvm*/lib | sort -V | tail -1)"
            export LIBCLANG_PATH
            ruby -v
            gem install bundler --no-document
            bundle install
            bundle exec rake compile
            bundle exec ruby -Ilib -rpsychowl -e 'abort "native extension not loaded" unless Psychowl.backend == :native'
            bundle exec rake test
            # gem install runs BSD make; the BSDmakefile must hand off to gmake.
            gem build psychowl.gemspec
            gem install --local --no-document psychowl-*.gem
            cd /tmp && ruby -rpsychowl -e 'abort "installed gem did not build the extension" unless Psychowl.backend == :native'
