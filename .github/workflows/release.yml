name: Release gems

# Builds the source gem and precompiled native gems for a version tag and
# attaches them to the GitHub release. Pushing to RubyGems stays manual.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v7
        with:
          name: gem-ruby
          path: pkg/*.gem
          if-no-files-found: error

  native-gems:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - arm64-darwin
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - id: cross
        uses: oxidize-rb/actions/cross-gem@v1
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.3, 3.4, 4.0"
      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross.outputs.gem-path }}
          if-no-files-found: error

  attach:
    needs: [source-gem, native-gems]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gems
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: gems/*.gem
